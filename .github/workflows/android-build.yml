# بناء تطبيق «مقياس الواي فاي» على GitHub Actions
#
# - يعتمد على الـ Wrapper المضمَّن في المشروع (Gradle 9.5.0) فلا حاجة لتثبيت Gradle يدويًا.
# - يشغّل ثلاث مهام فقط: تجميع APK للتصحيح + اختبارات الوحدة + رفع الـ APK كـ Artifact.
# - التسريع: تخزين مؤقت (Cache) لـ Gradle User Home ومخزن البناء + الاعتماديات،
#   وتشغيل كل شيء في أمر Gradle واحد، وإلغاء التشغيلات القديمة تلقائيًا.
#
# ملاحظات:
# - الإصدارات مثبّتة بـ SHA (نفس النسخ المستخدمة في مستودع Google الرسمي android/snippets).
# - يمكن تعديل قائمة الفروع التي تُشغّل البناء من قسم on.push.branches.
# - إن كانت خاصية Actions معطّلة في المستودع: Settings → Actions → General → Allow all actions.

name: Android Build

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      variant:
        description: 'نوع البناء'
        type: choice
        options: [debug, release]
        default: debug
      run_tests:
        description: 'تشغيل اختبارات الوحدة'
        type: boolean
        default: true

# منع تكرار التشغيلات على نفس الفرع وإلغاء الأقدم (يوفّر الوقت والدقائق)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ———————————————————————————— بناء APK للتصحيح + الاختبارات ————————————————————————————
  build:
    name: Debug APK + Unit tests
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.variant == 'debug' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # يُستخدم داخل خطوة البناء لتفادي تشغيل الاختبارات عند اختيار المستخدم ذلك
      RUN_TESTS: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'

      # يخزّن مؤقتًا: مجلد Gradle User Home (الاعتماديات + مخزن البناء) والـ Wrapper،
      # ويعرض ملخصًا للبناء في صفحة التشغيل.
      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic # تنفيذ مفتوح المصدر يعتمد على Cache الخاص بـ GitHub Actions
          cache-read-only: false # الكتابة في الـ Cache حتى على الفروع غير الرئيسية (أسرع من ثاني تشغيل)
          cache-cleanup: on-success
          validate-wrappers: true # ملف gradle-wrapper.jar مأخوذ من مستودع Google الرسمي
          add-job-summary: always

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      # لا تُفشل البناء إن تعذّر التثبيت المسبق؛ سيكمل AGP بتنزيل ما ينقص.
      - name: Ensure Android SDK platform (android-37)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ -d "$SDK_ROOT/platforms/android-37" ]; then
            echo "android-37 موجود مسبقًا في $SDK_ROOT"
            exit 0
          fi
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-37" \
            || echo "::warning::تعذّر تثبيت platforms;android-37 مسبقًا، سيتكفّل AGP بتنزيله خلال البناء"

      # أمر واحد لكل المهام = تشغيل واحد لـ Gradle (أسرع من أمرين منفصلين).
      # الناتج يُحفظ في build.log لتحليل الأخطاء عند الفشل.
      - name: Build debug APK and run unit tests
        run: |
          set -o pipefail
          TASKS=":app:assembleDebug"
          if [ "$RUN_TESTS" = "true" ]; then
            TASKS="$TASKS :app:testDebugUnitTest"
          fi
          ./gradlew $TASKS --stacktrace --console=plain 2>&1 | tee build.log

      # عند الفشل: أهم أسطر الخطأ تُنشر كتنبيهات (annotations) تظهر في صفحة التشغيل مباشرة
      - name: Show failure details
        if: failure()
        run: |
          [ -f build.log ] || { echo "لا يوجد سجل بناء"; exit 0; }
          {
            echo "### أسطر الخطأ"
            echo '```'
            grep -E "^e: |^w: file|error: |Execution failed for task|What went wrong|Caused by:|Could not (find|resolve|determine|install)" build.log | head -40 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          mapfile -t ERRORS < <(grep -E "^e: |error: |Execution failed for task|What went wrong|Could not (find|resolve|determine|install)" build.log | head -10)
          for line in "${ERRORS[@]}"; do
            echo "::error title=Build::$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')"
          done
          # آخر 30 سطرًا في تنبيه واحد (يحتوي عادةً على سبب الفشل النهائي)
          TAIL="$(tail -n 30 build.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=Tail::${TAIL}"

      - name: Upload build log (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
          compression-level: 9
          retention-days: 7

      - name: Upload debug APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          compression-level: 0 # الـ APK مضغوط أصلًا، فالرفع يصبح أسرع
          retention-days: 7

      - name: Upload unit test report (on failure)
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: unit-test-report
          path: app/build/reports/tests/
          if-no-files-found: ignore
          retention-days: 7

  # ————————————————————— بناء الإصدار (عند إنشاء وسم v* أو يدويًا) —————————————————————
  # ينتج APK غير موقّع (app-release-unsigned.apk). أضف مفتاح التوقيع عبر Secrets إن أردت نسخة موقّعة.
  release:
    name: Release APK (unsigned)
    if: ${{ startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.variant == 'release') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # لإنشاء Release ورفع ملف APK إليه عند بناء وسم v*

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25 (Zulu)
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: zulu
          java-version: '25'

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: basic
          cache-read-only: false
          validate-wrappers: true

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Ensure Android SDK platform (android-37)
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          if [ ! -d "$SDK_ROOT/platforms/android-37" ]; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager --install "platforms;android-37" \
              || echo "::warning::تعذّر تثبيت platforms;android-37 مسبقًا، سيتكفّل AGP بتنزيله خلال البناء"
          fi

      - name: Build release APK (R8 + resource shrinking)
        run: ./gradlew :app:assembleRelease --stacktrace --console=plain 2>&1 | tee build.log

      - name: Show failure details
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          mapfile -t ERRORS < <(grep -E "^e: |error: |Execution failed for task|What went wrong|Could not (find|resolve|determine|install)" build.log | head -10)
          for line in "${ERRORS[@]}"; do
            echo "::error title=Build::$(printf '%s' "$line" | sed 's/%/%25/g; s/\r//g')"
          done
          TAIL="$(tail -n 30 build.log | sed 's/%/%25/g; s/\r//g' | sed ':a;N;$!ba;s/\n/%0A/g')"
          echo "::error title=Tail::${TAIL}"

      - name: Upload release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Attach APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "بناء تلقائي من GitHub Actions"
          gh release upload "$GITHUB_REF_NAME" app/build/outputs/apk/release/*.apk --clobber
