name: Android Build (All ABIs)

on:
  push:
    branches: [main, 'arena/**']
    paths-ignore:
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build all Android ABIs + tests
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: enhanced
          cache-cleanup: on-success
          validate-wrappers: true
          add-job-summary: always

      - name: Build all release ABIs and run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest -Pmywifi.allAbis=true --stacktrace --console=plain 2>&1 | tee build.log

      - name: Surface build errors on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            {
              grep -E '(^e: |^w: |^ERROR:|^error:|^FAILURE:|^\* What went wrong:|^Execution failed for task|^> Task .* FAILED|^> There were failing tests)' build.log || true
            } | tail -n 40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=Gradle build failure::$line"
            done
          fi

      - name: Verify all ABI APKs and release signature
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          EXPECTED_APKS=(
            app-arm64-v8a-release.apk
            app-armeabi-v7a-release.apk
            app-x86_64-release.apk
            app-x86-release.apk
            app-universal-release.apk
          )
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          [[ -x "$APKSIGNER" ]] || { echo '::error::apksigner was not found'; exit 1; }

          {
            echo '### All-ABI APKs (CI)'
            echo
            echo '| File | Size |'
            echo '|---|---:|'
          } >> "$GITHUB_STEP_SUMMARY"

          for name in "${EXPECTED_APKS[@]}"; do
            apk="$APK_DIR/$name"
            [[ -s "$apk" ]] || { echo "::error title=Missing APK::$name"; exit 1; }
            "$APKSIGNER" verify "$apk"
            size="$(du -h "$apk" | cut -f1)"
            echo "| \`$name\` | $size |" >> "$GITHUB_STEP_SUMMARY"
            echo "Verified $name ($size)"
          done

      - name: Upload all-ABI APK artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: all-abi-apks-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
