name: Android ARM64 Test Build

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-arm64-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify ARM64 test APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6
        with:
          cache-provider: enhanced
          cache-cleanup: on-success
          validate-wrappers: true
          add-job-summary: always

      - name: Build ARM64 APK and run unit tests
        run: |
          set -o pipefail
          ./gradlew :app:assembleRelease :app:testReleaseUnitTest -Pmywifi.allAbis=false --stacktrace --console=plain 2>&1 | tee build.log

      - name: Surface build errors on failure
        if: failure()
        shell: bash
        run: |
          if [[ -f build.log ]]; then
            {
              grep -E '(^e: |^w: |^ERROR:|^error:|^FAILURE:|^\* What went wrong:|^Execution failed for task|^> Task .* FAILED|^> There were failing tests)' build.log || true
            } | tail -n 40 | while IFS= read -r line; do
              line="${line//'%'/'%25'}"
              echo "::error title=Gradle build failure::$line"
            done
          fi

      - name: Verify ARM64 APK and signature
        shell: bash
        run: |
          set -euo pipefail
          APK_DIR="app/build/outputs/apk/release"
          EXPECTED_APK="$APK_DIR/app-arm64-v8a-release.apk"
          APKSIGNER="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          [[ -x "$APKSIGNER" ]] || { echo '::error::apksigner was not found'; exit 1; }
          [[ -s "$EXPECTED_APK" ]] || { echo '::error title=Missing APK::Expected app-arm64-v8a-release.apk'; exit 1; }

          mapfile -t apks < <(find "$APK_DIR" -maxdepth 1 -type f -name '*.apk' -print | sort)
          if [[ "${#apks[@]}" -ne 1 ]]; then
            echo '::error title=Unexpected APK output::The test build must produce only the ARM64 APK.'
            printf '%s\n' "${apks[@]}"
            exit 1
          fi
          if [[ "${apks[0]##*/}" != "app-arm64-v8a-release.apk" ]]; then
            echo '::error title=Unexpected APK output::The test build must produce only the ARM64 APK.'
            printf '%s\n' "${apks[@]}"
            exit 1
          fi

          "$APKSIGNER" verify "$EXPECTED_APK"
          size="$(du -h "$EXPECTED_APK" | cut -f1)"
          {
            echo '### ARM64 Test APK'
            echo
            echo '| File | Size |'
            echo '|---|---:|'
            echo "| \`app-arm64-v8a-release.apk\` | $size |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Verified app-arm64-v8a-release.apk ($size)"

      - name: Upload ARM64 test APK artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-test-apk-${{ github.run_number }}
          path: app/build/outputs/apk/release/app-arm64-v8a-release.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arm64-test-build-log-${{ github.run_number }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
