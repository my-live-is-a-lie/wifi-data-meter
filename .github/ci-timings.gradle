// ملف تشخيصي مؤقت: يطبع زمن كل مهمة تستغرق ثانية أو أكثر (يُستدعى بـ -I).
def starts = [:]
gradle.allprojects { p ->
    p.tasks.configureEach { t ->
        t.doFirst { starts[t.path] = System.currentTimeMillis() }
        t.doLast {
            def ms = System.currentTimeMillis() - (starts[t.path] ?: System.currentTimeMillis())
            if (ms >= 1000) {
                println("TIMING ${ms}ms ${t.path}")
            }
        }
    }
}
