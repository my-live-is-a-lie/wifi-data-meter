# إعدادات Gradle — مضبوطة لتسريع البناء محليًا وعلى GitHub Actions
#
# ملاحظة عن الذاكرة: الـ Runner القياسي في GitHub Actions يوفّر 4 أنوية و16 جيجابايت رام،
# لذلك نعطي Gradle 4 جيجابايت (بدل 2048m) لأن مراحل R8/Kotlin تستفيد من الذاكرة الإضافية
# ويقل فيها جمع النفايات (GC) الذي يُبطئ البناء. القيمة 2048m مناسبة فقط للبيئات الأصغر.

# ————— سرعة البناء الأساسية —————
org.gradle.caching=true          # تخزين مخرجات المهام (Build Cache) محليًا
org.gradle.parallel=true         # تشغيل المهام المستقلة بالتوازي
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn
org.gradle.configureondemand=false

# في بيئة CI لا فائدة من مراقبة نظام الملفات (كل تشغيل يبدأ من نسخة نظيفة)
org.gradle.vfs.watch=false

# ————— الذاكرة —————
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# ————— Kotlin —————
kotlin.incremental=true
kotlin.code.style=official

# ————— AndroidX —————
android.useAndroidX=true
android.nonTransitiveRClass=true
