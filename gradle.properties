# إعدادات Gradle
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configureondemand=false

# التخزين المؤقت للإعدادات (تسريع عمليات البناء المتكررة)، مع عدم إفشال البناء
# إن واجه Gradle مشكلة في التوافق — يتجاهل الميزة ويكمل.
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ذاكرة كافية لعملية Kotlin عند البناء على بيئات CI المحدودة الموارد
kotlin.daemon.jvmargs=-Xmx2g -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Kotlin
kotlin.code.style=official
